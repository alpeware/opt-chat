[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optchat"
version = "0.1.0"
description = "OptChat: an endless chat where the AI remembers everything"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.4",
    "httpx>=0.28.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
optchat = "optchat.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
